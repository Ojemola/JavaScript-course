<!DOCTYPE html>
<html>
  <head></head>
  <body>
   <button onclick="
    const numberRandom = Math.random();

    let moveComputer = '';
    
    if (numberRandom >= 0 && numberRandom < 1/3) {
      moveComputer = 'Rock';
    } else if (numberRandom >= 1/3 && numberRandom < 2/3) {
      moveComputer = 'Paper';
    } else if (numberRandom >= 2/3 && numberRandom < 1) {
      moveComputer = 'Scissors';
    }
     
    console.log(moveComputer);

    let result = '';

    if (moveComputer === 'Rock') {
      result = 'Tie.';
    } else if (moveComputer === 'Paper') {
      result = 'Ypu lose.'
    } else if (moveComputer === 'Scissors') {
      result = 'You win.';
    }
    
    alert(`You picked rock. Computer picked ${moveComputer}. ${result}`);
    
    ">Rock</button>

    <button>Paper</button>
  </body>
</html>
